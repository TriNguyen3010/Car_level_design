<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Sort — Level &amp; Feel Tool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a90d9'/%3E%3Crect x='7' y='5' width='18' height='22' rx='6' fill='%23f0c132'/%3E%3Crect x='11' y='21' width='10' height='3' rx='1.5' fill='%23000' opacity='.45'/%3E%3C/svg%3E">
<!-- Dev tool: the stylesheet is written with a cache-busting token because
     Chrome keeps it in the per-tab memory cache even when the server says
     no-store, and a stale sheet silently breaks the board layout. -->
<script>document.write('<link rel="stylesheet" href="css/tool.css?t=' + Date.now() + '">');</script>
</head>
<body>
<div id="app">
  <!-- Row 1 is the run in progress, with the mode switch parked far right.
       Row 2 is the campaign and the meta readouts. -->
  <div id="top">
    <div class="hdr-row">
      <div class="hdr-left">
        <button id="prevLv" data-i18n-title="prevLevel">◀</button>
        <span class="badge"><span data-i18n="level">Level</span> <b id="lvName">1</b> <span id="lvCount" style="color:var(--ink-dim)"></span></span>
        <button id="nextLv" data-i18n-title="nextLevel">▶</button>
        <span class="sep"></span>
        <span class="badge" id="movesBadge">Moves <b>0</b></span>
        <span class="badge" id="sizeBadge">4×4</span>
        <span class="sep"></span>
        <button id="restart" data-i18n="restart">Restart</button>
        <button id="undo" data-i18n="undo">Undo</button>
        <button id="hint" data-i18n="hint">Hint</button>
        <button id="autoplay" data-i18n="autoplay">Autoplay</button>
        <span class="sep"></span>
        <button id="boardToggle" data-i18n-title="boardToggleT"></button>
      </div>
      <div class="hdr-right">
        <span class="modes" id="modeSwitch">
          <button data-mode="test" data-i18n-title="modeTestT" data-i18n="modeTest">▶ Test</button>
          <button data-mode="playtune" data-i18n-title="modePlaytuneT" data-i18n="modePlaytune">🎮 Chơi &amp; cân</button>
          <button data-mode="design" data-i18n-title="modeDesignT" data-i18n="modeDesign">⚙ Level Design</button>
        </span>
      </div>
    </div>

    <div class="hdr-row">
      <div class="hdr-left">
        <span class="sets" id="setPick"></span>
      </div>
      <div class="hdr-right">
        <span class="badge" id="statusBadge">playing</span>
        <button id="gcQuickOne" data-i18n="gcQuickOne" data-i18n-title="gcQuickOneT"></button>
        <button id="gcQuickAll" data-i18n="gcQuickAll" data-i18n-title="gcQuickAllT"></button>
        <span class="sep"></span>
        <button id="helpGuide" data-i18n-title="guideT" data-i18n="guide">Hướng dẫn</button>
        <button id="langToggle" data-i18n="langLabel" data-i18n-title="langTitle"></button>
        <span class="badge" id="buildStamp" data-i18n-title="buildT">build …</span>
      </div>
    </div>
  </div>

  <div id="playtuneBar"></div>
  <div id="tuneBanner"></div>

  <div id="main">
    <div id="boardWrap">
      <div id="stage">
        <div class="result" id="result"></div>
      </div>
    </div>

    <div id="side">
      <div id="tabs">
        <button data-tab="curve" class="on" data-i18n="tabCurve">Độ khó</button>
        <button data-tab="play" data-i18n="tabPlay">Play</button>
        <button class="playtune-only" data-tab="journal" data-i18n="tabJournal">Nhật ký</button>
        <button class="design-only" data-tab="tune" data-i18n="tabTune">Tune</button>
        <button class="design-only" data-tab="edit" data-i18n="tabEdit">Edit</button>
        <button data-tab="playtest" data-i18n="tabPlaytest">Playtest</button>
        <button class="design-only" data-tab="feel" data-i18n="tabFeel">Feel</button>
        <button data-tab="set" data-i18n="tabSet">Level Set</button>
      </div>
      <div id="panels">

        <div class="panel" data-panel="play">
          <div class="row">
            <button class="primary" id="analyzePlay" data-i18n="measureThis">Đo level này</button>
            <span class="hint" id="analyzePlayNote" style="margin:0" data-i18n="measureHint"></span>
          </div>
          <div class="flag" id="modeHint" style="margin-bottom:10px"></div>
          <h3 data-i18n="curLevel">Level hiện tại</h3>
          <div class="metrics" id="playMetrics"></div>
          <h3 data-i18n="howToRead">Đọc số thế nào</h3>
          <div class="hint"><span data-i18n="howToReadA"></span> <span class="help" data-help="do-sau"></span> <span data-i18n="howToReadB"></span></div>
          <h3 data-i18n="moveLog">Move log</h3>
          <div class="log" id="moveLog">—</div>
        </div>

        <div class="panel" data-panel="journal">
          <div id="setIntent" class="card"></div>
          <h3 data-i18n="lockedTiers">Bậc đã chốt cho từng level</h3>
          <div id="journalSet"></div>
          <h3 data-i18n="tierCurve">Curve bậc</h3>
          <div id="journalCurve"></div>
          <h3 data-i18n="runLog">Nhật ký lượt chơi</h3>
          <div class="row">
            <button id="journalClear" data-i18n="clearLog">Xoá nhật ký</button>
            <button id="journalCopy" data-i18n="copyJson">Copy JSON</button>
            <span class="hint" id="journalCount" style="margin:0"></span>
          </div>
          <div id="journalLog"></div>
        </div>

        <div class="panel" data-panel="tune">
          <h3><span data-i18n="tplTitle"></span> <span class="help" data-help="template"></span></h3>
          <div class="row">
            <span class="hint" id="tplNow" style="margin:0">—</span>
          </div>
          <div class="row">
            <label style="min-width:0" data-i18n="applyTo"></label>
            <select id="tplScope">
              <option value="one" data-i18n="scopeOne"></option>
              <option value="all" data-i18n="scopeAll"></option>
              <option value="range" data-i18n="scopeRange"></option>
            </select>
            <span id="tplRange" style="display:none">
              <label style="min-width:0" data-i18n="from"></label>
              <input type="number" id="tplFrom" value="1" min="1" style="width:56px">
              <label style="min-width:0" data-i18n="to"></label>
              <input type="number" id="tplTo" value="10" min="1" style="width:56px">
            </span>
            <span class="grow" style="flex:1"></span>
            <label style="min-width:0" data-i18n="seed"></label>
            <input type="number" id="tplSeed" value="1" style="width:56px">
            <span class="hint" id="tplProgress" style="margin:0"></span>
          </div>
          <div id="tplCards"></div>
          <details style="margin-top:8px">
            <summary class="hint" style="cursor:pointer" data-i18n="editTpl"></summary>
            <textarea id="tplJson" rows="14" spellcheck="false"></textarea>
            <div class="row"><button id="tplLoad" data-i18n="loadThisJson"></button><button id="tplReset" data-i18n="resetDefault"></button></div>
          </details>

          <h3><span data-i18n="tuneTitle"></span> <span class="help" data-help="do-kho"></span></h3>
          <div class="metrics" id="tunerScore"></div>
          <div class="row" style="margin-top:9px">
            <button class="primary" id="wantHarder" data-i18n="wantHarder"></button>
            <button class="primary" id="wantEasier" data-i18n="wantEasier"></button>
            <label style="min-width:0"><span data-i18n="playoutsPer"></span> <span class="help" data-help="playout-runs"></span></label>
            <input type="number" id="suggestRuns" value="900" step="300" style="width:82px">
            <span id="suggestProgress" class="hint" style="margin:0"></span>
          </div>
          <div id="suggestions"></div>

          <h3 data-i18n="solverTitle"></h3>
          <div class="row">
            <button class="primary" id="analyze" data-i18n="analyzeThis"></button>
            <label style="min-width:0" data-i18n="nodeCap"></label>
            <input type="number" id="nodeCap" value="300000" step="50000" style="width:96px">
            <label style="min-width:0" data-i18n="playoutsW"></label>
            <input type="number" id="runs" value="300" step="50" style="width:74px">
            <label style="min-width:0"><span data-i18n="mistakeRate"></span> <span class="help" data-help="loi-tay"></span></label>
            <input type="number" id="eps" value="0.08" step="0.02" min="0" max="1" style="width:64px">
          </div>
          <div class="metrics" id="tuneMetrics"></div>
          <h3 data-i18n="verdict"></h3>
          <div class="flags" id="tuneFlags"></div>
          <h3 data-i18n="moveBudget"></h3>
          <div class="row">
            <label data-i18n="slackTarget"></label>
            <input type="number" id="slackTarget" value="1.6" step="0.1" min="1" style="width:74px">
            <button id="applyBudget" data-i18n="setBudgetBtn"></button>
          </div>
          <h3 data-i18n="bestSolution"></h3>
          <div class="log" id="solutionLog" data-i18n="notAnalyzed"></div>
        </div>

        <div class="panel" data-panel="edit">
          <div class="row">
            <label data-i18n="colsRows"></label>
            <input type="number" id="edCols" min="2" max="9" style="width:60px">
            <input type="number" id="edRows" min="2" max="9" style="width:60px">
            <label style="min-width:0" data-i18n="movesLabel"></label>
            <input type="number" id="edMoves" min="1" style="width:74px">
            <label style="min-width:0" data-i18n="theme"></label>
            <select id="edTheme"><option value="city">city</option><option value="suburb">suburb</option></select>
          </div>
          <h3 data-i18n="brush"></h3>
          <div class="swatches" id="brushes"></div>
          <div class="row" style="margin-top:7px">
            <label style="min-width:0"><input type="checkbox" id="brushHidden"> <span data-i18n="paintHidden"></span></label>
            <span class="hint" style="margin:0" data-i18n="paintHelp"></span>
          </div>
          <h3><span data-i18n="gridWord"></span> <span class="hint" style="margin:0" data-i18n="gridNote"></span></h3>
          <div id="editGrid"></div>
          <h3><span data-i18n="colRules"></span> <span class="hint" style="margin:0" data-i18n="colRulesNote"></span></h3>
          <div id="colRules"></div>
          <div class="row"><label data-i18n="padCar"></label><div id="padCell"></div></div>
          <h3 data-i18n="carCount"></h3>
          <div class="countList" id="counts"></div>
          <div class="flags" id="editFlags" style="margin-top:8px"></div>
          <h3 data-i18n="generate"></h3>
          <div class="row">
            <label data-i18n="colorCount"></label><input type="number" id="genColors" value="4" min="1" max="9" style="width:60px">
            <label style="min-width:0" data-i18n="straysWord"></label><input type="number" id="genStrays" value="6" min="0" style="width:60px">
            <label style="min-width:0" data-i18n="hiddenWord"></label><input type="number" id="genHidden" value="0" min="0" style="width:60px">
            <label style="min-width:0" data-i18n="seed"></label><input type="number" id="genSeed" value="1" style="width:60px">
          </div>
          <div class="row">
            <label><input type="checkbox" id="genRevInGrid" checked> <span data-i18n="revInGrid"></span></label>
            <button id="genBtn" data-i18n="genIntoLevel"></button>
          </div>
          <div class="hint" data-i18n-html="genHelp"></div>
        </div>

        <div class="panel on" data-panel="curve">
          <div class="row">
            <span class="hint" style="margin:0" id="curveWho"></span>
            <span class="grow" style="flex:1"></span>
            <button class="primary" id="curveMeasure" data-i18n="measureWholeSet">Đo cả bộ</button>
            <span class="hint" id="curveProgress" style="margin:0"></span>
          </div>
          <h3 data-i18n="fourSets">Bốn bộ cạnh nhau</h3>
          <div id="curveCompare"></div>
          <h3 data-i18n="activeSet">Bộ đang chọn</h3>
          <div id="curveActive"></div>
          <h3 data-i18n="perLevel">Từng level</h3>
          <div id="curveLevels"></div>
        </div>

        <div class="panel" data-panel="playtest">
          <div class="row">
            <button class="primary" id="runPlaytest" data-i18n="runPlaytest"></button>
            <label style="min-width:0" data-i18n="runCount"></label>
            <input type="number" id="ptRuns" value="10000" step="1000" style="width:96px">
            <label style="min-width:0"><input type="checkbox" id="ptBlind" checked> <span data-i18n="blindPlayer"></span></label>
            <span id="ptProgress" class="hint" style="margin:0"></span>
          </div>
          <div class="hint" data-i18n-html="playtestHelp"></div>
          <div id="ptSummary"></div>
          <h3><span data-i18n="budgetToWin"></span> <span class="help" data-help="budget-curve"></span></h3>
          <div id="ptCurve"></div>
          <h3 data-i18n="movesActually"></h3>
          <div id="ptHist"></div>
          <h3><span data-i18n="conclusion"></span> <span class="help" data-help="no-dead-end"></span></h3>
          <div class="flags" id="ptFlags"></div>
        </div>

        <div class="panel" data-panel="feel">
          <div class="row">
            <label data-i18n="preset"></label>
            <select id="feelPreset"></select>
            <button id="feelReset" data-i18n="resetWord"></button>
            <label style="min-width:0"><input type="checkbox" id="sfxOn" checked> SFX</label>
            <label style="min-width:0"><input type="checkbox" id="useSprites"> <span data-i18n="useSprites"></span></label>
          </div>
          <div id="feelSliders"></div>
          <h3 data-i18n="feelJson"></h3>
          <textarea id="feelJson" rows="9" spellcheck="false"></textarea>
          <div class="row"><button id="feelLoad" data-i18n="loadJson"></button><button id="feelCopy" data-i18n="copyWord"></button></div>
        </div>

        <div class="panel" data-panel="set">
          <div class="row">
            <button class="primary" id="runAll" data-i18n="analyzeAll"></button>
            <span class="design-only"><button id="addLevel" data-i18n="addLevel"></button></span>
            <span class="design-only"><button id="dupLevel" data-i18n="duplicate"></button></span>
            <span class="design-only"><button id="delLevel" data-i18n="del"></button></span>
          </div>
          <div id="setTableWrap"><table class="grid" id="setTable"></table></div>
          <h3 data-i18n="curveWord"></h3>
          <div id="curve"></div>
          <div class="design-only">
            <h3 data-i18n="exportWord"></h3>
            <div class="row">
              <button class="primary" id="exportBtn" data-i18n="exportJson"></button>
              <button id="downloadBtn" data-i18n="downloadJson"></button>
              <button id="importBtn" data-i18n="importJson"></button>
            </div>
            <textarea id="exportJson" rows="14" spellcheck="false"></textarea>
            <h3 data-i18n="gcHead"></h3>
            <div class="row">
              <label data-i18n="gcExtraLabel"></label>
              <input type="number" id="gcExtra" min="0" max="8" value="0" style="width:56px">
              <label style="min-width:0" data-i18n="gcAttempts"></label>
              <input type="number" id="gcAttempts" value="1000" step="100" min="1" style="width:82px">
              <label style="min-width:0" data-i18n="gcSteps"></label>
              <input type="number" id="gcSteps" value="0" min="0" style="width:56px">
              <label style="min-width:0"><input type="checkbox" id="gcHard"> <span data-i18n="gcHardLabel"></span></label>
            </div>
            <div class="row">
              <button class="primary" id="gcOne" data-i18n="gcOne"></button>
              <button id="gcAll" data-i18n="gcAll"></button>
              <button id="gcDown" data-i18n="gcDown"></button>
              <button id="gcDownAll" data-i18n="gcDownAll"></button>
              <button id="gcImport" data-i18n="gcImport"></button>
              <span class="hint" id="gcNote" style="margin:0"></span>
            </div>
            <div class="hint" data-i18n-html="gcHelp"></div>
            <textarea id="gcJson" rows="14" spellcheck="false"></textarea>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
/* Dev tool: every module is written with a cache-busting token. Chrome keeps
   src/*.js in the per-tab memory cache even when the server says no-store, and
   a stale module presents as "my change did not show up". document.write keeps
   the load order, which plain dynamic injection would not. */
(function () {
  var t = Date.now();
  [ 'i18n', 'help', 'modal', 'sprites', 'engine', 'levels', 'sets', 'set40', 'solver', 'gen',
    'gameconfig', 'playtest', 'tuner', 'difficulty', 'feel', 'render', 'tool'
  ].forEach(function (m) {
    document.write('<script src="src/' + m + '.js?t=' + t + '"><\/script>');
  });
})();
</script>
</body>
</html>
